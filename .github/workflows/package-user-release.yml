name: Package Windows user release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing user release tag
        required: true
      build_run:
        description: Successful CI run for the tag
        required: true

permissions:
  actions: read
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify the build belongs to the release
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+(\.[0-9]+){2,3}-user$') { throw 'Invalid user release tag' }
          $build = gh run view $env:BUILD_RUN --json headSha,conclusion | ConvertFrom-Json
          if ($build.conclusion -ne 'success' -or $build.headSha -ne (git rev-parse HEAD)) {
            throw 'Use a successful CI run from the release commit'
          }
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'The user release must be a draft' }
      - uses: actions/download-artifact@v4
        with:
          name: BrushBridge-windows
          path: dist/BrushBridge
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package and upload user files
        run: |
          $base = 'BrushBridge-' + $env:RELEASE_TAG.Substring(1).Replace('-user', '-User')
          $out = Join-Path $env:RUNNER_TEMP $base
          python scripts/make_user_release.py --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_msi.py --source $out --out "$out.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lines = foreach ($ext in 'msi', 'zip') {
            $hash = Get-FileHash -LiteralPath "$out.$ext"
            $hash.Hash.ToLowerInvariant() + "  $base.$ext"
          }
          $lines | Set-Content -LiteralPath "$out-SHA256.txt" -Encoding ascii
          gh release upload $env:RELEASE_TAG "$out.msi" "$out.zip" "$out-SHA256.txt" --clobber
          exit $LASTEXITCODE
