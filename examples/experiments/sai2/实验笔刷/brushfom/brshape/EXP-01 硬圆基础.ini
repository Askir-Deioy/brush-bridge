;
; 初始参数（由 brush-bridge 生成）
;
[Parameters]

	;
	; [浓度]
	;
	;    值的设置范围：0 ～ 100
	;
	;    ※ 选项不存在时默认值为 100。
	;
	Opacity = 100

	;
	; [角度控制]
	;
	;    值的设置范围：0 ... 无 / 1 ... 自动 / 2 ... 笔杆方向
	;
	;    ※ 选项不存在时默认值为 1。
	;
	AngleControl = 0

	;
	; [角度]
	;
	;    值的设置范围：-180 ～ +180 (角度)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	Angle = +0

	;
	; [角度抖动]
	;
	;    值的设置范围：0 ～ 100 (%)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	AngleJitter = 0

	;
	; [倍率]
	;
	;    值的设置范围：0 ～ 200 (%)
	;
	;    ※ 选项不存在时默认值为 100。
	;
	Scaling = 100

	;
	; [大小抖动]
	;
	;    值的设置范围：0 ～ 100 (%)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	SizeJitter = 0

	;
	; [间距]
	;
	;    值的设置范围：0 ～ 1000 (%)；笔刷形状为 0 ～ 50
	;
	;    ※ 选项不存在时默认值为 25。
	;
	Spacing = 12

	;
	; [散布]
	;
	;    值的设置范围：0 ～ 1000 (%)；笔刷形状为 0 ～ 50
	;
	;    ※ 选项不存在时默认值为 0。
	;
	Scattering = 0

	;
	; [高品质缩小]
	;
	;    值的设置范围：0 ... 速度优先 / 1 ... 品质优先
	;
	;    ※ 选项不存在时默认值为 0。
	;
	HighQualitySampling = 1

