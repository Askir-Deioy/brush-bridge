;
; 初始参数（由 brush-bridge 生成）
;
[Parameters]

	;
	; [角度控制]
	;
	;    值的设置范围：0 ... 无 / 1 ... 自动 / 2 ... 笔杆方向
	;
	;    ※ 选项不存在时默认值为 1。
	;
	AngleControl = 0

	;
	; [角度]
	;
	;    值的设置范围：-180 ～ +180 (角度)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	Angle = +0

	;
	; [角度抖动]
	;
	;    值的设置范围：0 ～ 100 (%)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	AngleJitter = 20

	;
	; [倍率]
	;
	;    值的设置范围：0 ～ 200 (%)
	;
	;    ※ 选项不存在时默认值为 100。
	;
	Scaling = 100

	;
	; [图案大小]
	;
	;    值的设置范围：1 ～ 5000 (px)
	;
	;    ※ 选项不存在时默认值为 100。
	;
	ShapeSize = 36

	;
	; [大小抖动]
	;
	;    值的设置范围：0 ～ 100 (%)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	SizeJitter = 0

	;
	; [间距]
	;
	;    值的设置范围：0 ～ 1000 (%)；笔刷形状为 0 ～ 50
	;
	;    ※ 选项不存在时默认值为 25。
	;
	Spacing = 16

	;
	; [散布]
	;
	;    值的设置范围：0 ～ 1000 (%)；笔刷形状为 0 ～ 50
	;
	;    ※ 选项不存在时默认值为 0。
	;
	Scattering = 85

	;
	; [W:H (纵横比)]
	;
	;    值的设置范围：100:1 ～ 100:100 ～ 1:100
	;
	;    ※ 选项不存在时默认值为 100:100。
	;
	WxHRatio = 100:100

	;
	; [WH抖动 (纵横比抖动)]
	;
	;    值的设置范围：0 ～ 100 (%)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	WxHJitter = 0

	;
	; [计数]
	;
	;    值的设置范围：1 ～ 20
	;
	;    ※ 选项不存在时默认值为 1。
	;
	Count = 3

	;
	; [计数抖动]
	;
	;    值的设置范围：0 ～ 100 (%)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	CountJitter = 45

	;
	; [往全方向散布]
	;
	;    值的设置范围：0 ... 仅与笔画方向直交 / 1 ... 全方向
	;
	;    ※ 选项不存在时默认值为 0。
	;
	AllDirScattering = 1

	;
	; [高斯分布]
	;
	;    值的设置范围：0 ... 均匀 / 1 ... 离光标越远密度越低
	;
	;    ※ 选项不存在时默认值为 0。
	;
	GaussianDistribution = 0

	;
	; [绝对大小]
	;
	;    值的设置范围：0 ... 画笔大小×倍率 / 1 ... 使用“图案大小”
	;
	;    ※ 选项不存在时默认值为 0。
	;
	AbsoluteSize = 0

	;
	; [整数坐标]
	;
	;    值的设置范围：0 / 1
	;
	;    ※ 选项不存在时默认值为 0。
	;
	IntegerPosition = 0

	;
	; [高品质缩小]
	;
	;    值的设置范围：0 ... 速度优先 / 1 ... 品质优先
	;
	;    ※ 选项不存在时默认值为 0。
	;
	HighQualitySampling = 1

	;
	; [前景色到背景色的抖动]
	;
	;    值的设置范围：0 ～ 100 (%)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	ColJitter = 0

	;
	; [色相抖动]
	;
	;    值的设置范围：0 ～ 100 (%)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	HueJitter = 0

	;
	; [饱和度抖动]
	;
	;    值的设置范围：0 ～ 100 (%)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	SaturationJitter = 0

	;
	; [亮度抖动]
	;
	;    值的设置范围：0 ～ 100 (%)
	;
	;    ※ 选项不存在时默认值为 0。
	;
	BrightnessJitter = 0

	;
	; [应用到每一个形状]
	;
	;    值的设置范围：0 ... 每个笔画 / 1 ... 每一个形状
	;
	;    ※ 选项不存在时默认值为 0。
	;
	ApplyToEachShape = 1

